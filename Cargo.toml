[package]
name = "pump-rust-client"
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
# `resolver = "3"` requires Cargo's unstable `edition2024` (rejected by solana-verify / cargo 1.81).
resolver = "2"
description = "Rust SDK for the pump and pump_amm Solana programs: instruction builders, quoting, PDA helpers, and optional RPC client features."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/nirholas/pumpfun-rust-client"
homepage = "https://nirholas.github.io/pumpfun-rust-client/"
documentation = "https://docs.rs/pump-rust-client"
keywords = ["solana", "pump-fun", "pumpswap", "amm", "sdk"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
# The library needs its sources and the IDLs `declare_program!` reads at
# compile time. The local-validator binaries, examples and integration tests
# depend on `artifacts/` and `keys/`, which stay in the repository only.
include = [
    "/src/**/*.rs",
    "!/src/bin/**",
    "/idls/*.json",
    "/README.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
features = ["client"]

[lib]
name = "pump_rust_client"

[features]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
client = ["dep:solana-sdk", "dep:solana-client"]
local-validator = [
    "client",
    "dep:solana-program",
    "dep:solana-test-validator",
    "dep:solana-faucet",
    "dep:solana-streamer",
    "dep:solana-rpc",
    "dep:spl-token",
    "dep:spl-token-2022",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:bincode",
    "dep:zstd",
    "dep:crossbeam-channel",
    "dep:dotenvy",
]

[lints.rust]
# `declare_program!` expands to `cfg(target_os = "solana")` checks; declare
# "solana" as a known target_os instead of silencing every unexpected cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
# Instruction builders intentionally take one argument per account; the account
# sets are dictated by the on-chain programs, not a style choice.
too_many_arguments = "allow"

[dependencies]
fastrand = "2"

anchor-lang = { version = ">=0.31, <2", features = ["event-cpi", "init-if-needed", "allow-missing-optionals"] }
anchor-spl = { version = ">=0.31, <2", features = ["metadata", "spl-token-group-interface", "token_2022", "spl-token-metadata-interface", "token_2022_extensions"] }

solana-sdk = { version = ">=2.1.21, <3", optional = true }
solana-client = { version = ">=2.1.21, <3", optional = true }

# Optional deps used only when the `local-validator` feature is enabled.
solana-program = { version = ">=2.1.21, <3", optional = true }
solana-test-validator = { version = "2.1.21", optional = true }
solana-faucet = { version = "2.1.21", optional = true }
solana-streamer = { version = "2.1.21", optional = true }
solana-rpc = { version = "2.1.21", optional = true }
spl-token = { version = "=7.0.0", optional = true }
spl-token-2022 = { version = "=6.0.0", optional = true }
tokio = { version = "1.44.1", features = ["full"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "1.3", optional = true }
zstd = { version = "0.13", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
dotenvy = { version = "0.15", optional = true }

[dev-dependencies]
proptest = { version = "1.5", default-features = false, features = ["std"] }
serde_json = "1"
solana-sdk = ">=2.1.21, <3"
solana-client = ">=2.1.21, <3"
tokio = { version = "1.44.1", features = ["full"] }

[[bin]]
name = "local-validator"
path = "src/bin/local_validator/main.rs"
required-features = ["local-validator"]

[[bin]]
name = "clone_devnet_accounts"
path = "src/bin/clone_devnet_accounts/main.rs"
required-features = ["local-validator"]

